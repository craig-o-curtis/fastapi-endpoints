[tool.ruff]
# Target Python 3.12 for broad compatibility
target-version = "py312"

# Files to include/exclude
include = ["books_api/**/*.py", "books_api/*.py"]
exclude = [
    "fastapienv",
    "__pycache__",
    ".git",
]

line-length = 88

[tool.ruff.lint]
# Enable rule categories:
# E   - pycodestyle errors
# W   - pycodestyle warnings
# F   - pyflakes
# I   - isort (import sorting)
# UP  - pyupgrade (modern Python idioms)
# B   - flake8-bugbear (common bug patterns)
# SIM - flake8-simplify

select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["books_api"]
combine-as-imports = true

[tool.ruff.format]
# Use double quotes (matches PEP 8 / black default)
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Add trailing commas in multi-line expressions
skip-magic-trailing-comma = false
