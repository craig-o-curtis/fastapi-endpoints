[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["books_api*"]

[project]
name = "books-api"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.140.0",
    "uvicorn>=0.30.0",
    "bcrypt==4.0.1",
    "cryptography",
    "psycopg2-binary",
    "PyMySQL",
    "python-jose",
    "python-multipart",
    "SQLAlchemy",
    "passlib",
    "aiofiles",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "ty>=0.0.63",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
target-version = "py312"
include = ["books_api/**/*.py", "books_api/*.py"]
exclude = ["fastapienv", "__pycache__", ".git"]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["books_api"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
